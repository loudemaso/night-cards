<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Denver Dealer · Night Cards</title><style>
*{box-sizing:border-box}body{margin:0;background:#121019;color:#f7f0e7;font:16px system-ui,sans-serif}header,main,footer{max-width:1140px;margin:auto;padding:20px 30px}header,nav,.line,.actions{display:flex;align-items:center;gap:12px}header,.line{justify-content:space-between}header{border-bottom:1px solid #423549}strong.brand{font: bold 25px Georgia}.brand span,.kicker{color:#ffc88b}button,input,select{font:inherit}button{cursor:pointer;color:inherit;border:1px solid #514259;background:#251f2c;border-radius:8px;padding:11px 16px}button:hover,button.active{background:#453346;border-color:#ae839c}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f9c38d}main{padding-top:28px}.feature{display:grid;grid-template-columns:1fr 1fr;border:1px solid #59455b;overflow:hidden;border-radius:18px;background:radial-gradient(ellipse at 80% 25%,#513052,#211927 60%)}.copy{padding:clamp(25px,5vw,72px);align-self:center}.kicker,small{font: bold 11px/1.6 monospace;letter-spacing:.15em;text-transform:uppercase}h1,h2,h3,p{margin:0}h1,h2,h3{font-family:Georgia,serif;font-weight:normal}h1{font-size:clamp(44px,6vw,82px);line-height:.97;margin:18px 0}h2{font-size:34px}p{line-height:1.65;color:#d0c0cf;margin:14px 0 24px}.primary{background:#ffd29b;color:#251529;border:0;font-weight:750}.primary:hover{background:#ffe4c2}.stage{min-height:390px;display:grid;place-items:center;padding:32px;background:repeating-radial-gradient(ellipse at 50% 110%,transparent 0 28px,#cb98a222 29px 30px,transparent 31px 44px)}.stage img{width:min(64%,250px);transform:rotate(6deg);box-shadow:12px 22px 25px #100b17;border-radius:6%}.line{margin:30px 0 15px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.tile{text-align:left;padding:0;overflow:hidden;background:#221c28}.poster{display:grid;place-items:center;height:115px;background:repeating-radial-gradient(ellipse at 25% 140%,transparent 0 12px,#ffffff20 13px 15px,transparent 16px 20px),var(--ink);font:60px Georgia;color:#ffdfac}.tile article{padding:14px}.tile h3{font-size:24px}.tile small,footer{color:#beadbf}footer{font-size:12px;margin-top:26px;border-top:1px solid #403444}dialog{background:#28202e;color:inherit;border:1px solid #715a73;border-radius:16px;width:min(440px,94vw);padding:25px;max-height:90dvh}dialog::backdrop{background:#08050ccd}dialog .line{margin:0 0 12px}label{display:grid;gap:6px;margin:16px 0}input,select{width:100%;padding:12px;color:inherit;background:#19141e;border:1px solid #68566c;border-radius:6px}.panel{padding:22px;background:#241e2a;border-radius:12px;margin:12px 0}.actions{flex-wrap:wrap}
@media(max-width:680px){header,main,footer{padding:16px}header{flex-wrap:wrap}nav{width:100%;gap:6px}nav button{flex:1;padding:10px 5px}.feature{display:flex;flex-direction:column-reverse}.stage{min-height:0;padding:20px}.stage img{width:135px}.copy{padding:20px;width:100%}h1{margin:9px 0}.grid{grid-template-columns:repeat(2,1fr)}.line h2{font-size:27px}.tile h3{font-size:20px}}
.summer-art{aspect-ratio:1;background-size:500% 200%;background-image:var(--summer-sheet);display:flex;align-items:flex-end;justify-content:center;box-shadow:inset 0 0 0 2px #b89560}.summer-art span{font:700 10px Georgia;letter-spacing:.22em;color:#ffe1aa;background:#1b1322df;padding:7px 12px;border:1px solid #b89560;margin:10px}.tile article span{color:#dac8b7;font-size:13px}dialog .summer-art{max-width:220px;margin:12px auto}.grid:has(.summer-art){grid-template-columns:repeat(auto-fill,minmax(min(175px,44%),1fr))}</style><link rel="stylesheet" href="summer-art.css"><header><strong class="brand"><span>♦</span> Denver Dealer</strong><nav aria-label="Main navigation"></nav></header><main></main><footer>Denver Dealer · Nightlife Collectibles · Interactive demo</footer><dialog><div class="line"><h2 id="heading"></h2><button aria-label="Close dialog" onclick="box.close()">×</button></div><div id="body"></div></dialog><script>
const cards=[
 {name:'The Denver Dealer',day:'Nov 16',sign:'♦',ink:'#653055',story:'A velvet jacket, a gold cane, and one last dance beneath the disco ball.'},
 {name:'Velvet Fox',day:'Nov 15',sign:'♢',ink:'#8b415c',story:'A quick step across the velvet floor, a silver fan opening on the beat.'},
 {name:'Midnight Moth',day:'Nov 14',sign:'✦',ink:'#45417c',story:'Wings spread beneath the last violet beam of the night.'},
 {name:'Neon Jack',day:'Nov 13',sign:'♠',ink:'#286565',story:'A jackrabbit tips his hat under the neon marquee.'}];
const key='denver-dealer-demo-v1', main=document.querySelector('main'),box=document.querySelector('dialog'),body=document.querySelector('#body'),heading=document.querySelector('#heading');
let state={alias:'',cards:[],invite:''},page='Daily drop';
try{Object.assign(state,JSON.parse(localStorage.getItem(key)))}catch{}
function save(){localStorage.setItem(key,JSON.stringify(state))}

const summerNights = [
  ['Copper Hour','Jun 5','A fox plays the last rooftop set as the windows across the street catch fire with sunset.'],
  ['Blue Current','Jun 13','A heron leans into the synth, sending a low pulse through the blue room.'],
  ['Crate Digger','Jun 26','The raccoon slips a violet-label pressing from its sleeve and cues side B.'],
  ['Scarlet Shuffle','Jul 3','A jackrabbit cuts the deck one-handed while the brass band takes a break.'],
  ['Disco Lynx','Jul 11','Every mirrored tile catches a different flash of the lynx’s gold jacket.'],
  ['Night Frequency','Jul 24','One ear beneath the headphones, the owl holds the next track for one more bar.'],
  ['Silver Howl','Jul 31','A silver coyote leaves the stage lights behind and sings straight into the crowd.'],
  ['Emerald Pocket','Aug 8','The stag walks a bass line under green lights until the whole floor moves with him.'],
  ['Pink Flamingo','Aug 21','A flamingo lifts a citrus cocktail to the last streak of coral in the sky.'],
  ['After Midnight','Aug 29','The panther closes the summer with a drum solo beneath an indigo moon.']
];
const summerStart = cards.length;
summerNights.forEach(([name, day, story], portrait) => cards.push({name, day, story, portrait}));
const summerPreview = new URLSearchParams(location.search).get('collection') === 'summer-2026';
if (summerPreview) {
  if (!state.summer2026) {
    state.cards.push(...summerNights.map((_, i) => summerStart + i).reverse());
    state.summer2026 = true;
    if (!state.alias) state.alias = 'Lou';
    save();
  }
  page = 'Collection';
}
function portraitMarkup(card) {
  const x = (card.portrait % 5) * 25;
  const y = Math.floor(card.portrait / 5) * 100;
  return '<div class="summer-art" style="background-position:'+x+'% '+y+'%"><span>DENVER DEALER</span></div>';
}

function button(label,fn,style=''){const el=document.createElement('button');el.textContent=label;el.className=style;el.onclick=fn;return el}
function modal(title,html){heading.textContent=title;body.innerHTML=html;if(!box.open)box.showModal()}
function tile(id,count){const c=cards[id],el=button('',()=>detail(id),'tile');el.innerHTML=Number.isInteger(c.portrait) ? portraitMarkup(c)+'<article><small>Summer 2026</small><h3>'+c.name+'</h3><span>Purchased '+c.day+', 2026</span></article>' : '<div class="poster" style="--ink:'+c.ink+'">'+c.sign+'</div><article><small>'+c.day+(count?' · '+count+' owned':' · Night card')+'</small><h3>'+c.name+'</h3></article>';return el}
function detail(id){const c=cards[id];modal(c.name,'<small>Denver · '+c.day+' · 2026</small><p>'+c.story+'</p>');if(Number.isInteger(c.portrait)){body.insertAdjacentHTML('afterbegin',portraitMarkup(c));body.insertAdjacentHTML('beforeend','<p>Demo purchase · '+c.day+', 2026</p>');return}body.append(button('Collect this card',()=>checkout(id),'primary'))}
function checkout(id){modal('Collect '+cards[id].name,'<p>Demo checkout · Bronze edition · $80 per card</p><form><label>Quantity<input type="number" min="1" max="20" step="1" value="1" required></label><label>Payment method<select><option>Apple Pay</option><option>Google Pay</option><option>PayPal</option></select></label><p id="total"></p><button class="primary">Confirm demo collection</button></form>');const form=body.querySelector('form'),qty=form.querySelector('input');function update(){const reward=state.cards.length>=5&&!state.redeemed;form.querySelector('#total').textContent='Demo total $'+Math.max(0,80*(Number(qty.value)-(reward?1:0)))+(reward?' · One loyalty card applied':'')+' · No charge'}qty.oninput=update;update();form.onsubmit=e=>{e.preventDefault();if(state.cards.length>=5)state.redeemed=true;state.cards.push(...Array(Number(qty.value)).fill(id));save();render();modal('Added to your collection','<p>Your '+cards[id].name+' purchase was simulated and saved on this device.</p>');body.append(button('View collection',()=>{box.close();navigate('Collection')},'primary'))}}
function profile(){main.innerHTML='<h1>Collector pass</h1><section class="panel"><small>Alias</small><h2 id="alias"></h2><p>Your collection stays on this device.</p><div class="actions"></div></section><section class="panel"><h2>Member invitations</h2><p>Generate a fresh demo referral code. Each new code replaces the last one on this device.</p><output></output></section>';main.querySelector('#alias').textContent=state.alias||'Guest collector';main.querySelector('.actions').append(button('Demo sign-in',signin),button('Telegram support',()=>modal('Telegram support','<p>Demo support channel. A Telegram handle will appear here when the dealer connects one.</p>')));const out=main.querySelector('output');out.textContent=state.invite;out.before(button('Generate code',()=>{state.invite='DD-'+crypto.randomUUID().slice(0,8).toUpperCase();save();profile()}))}
function signin(){modal('Collector sign-in','<form><p>Preview phone sign-in with a fictional number.</p><label>Demo phone number<input type="tel" value="303-555-0100" required></label><button>Preview magic link</button></form>');body.querySelector('form').onsubmit=e=>{e.preventDefault();modal('Demo magic link','<p>No SMS was sent. Open the simulated link to choose your alias.</p>');body.append(button('Open demo link',()=>{modal('Choose an alias','<form><label>Collector alias<input maxlength="32" required pattern=".*\\S.*"></label><button>Save collector pass</button></form>');body.querySelector('form').onsubmit=e=>{e.preventDefault();state.alias=body.querySelector('input').value.trim();save();box.close();render()}}))}}
function navigate(to){page=to;render();window.scrollTo(0,0)}
function render(){const nav=document.querySelector('nav');nav.replaceChildren(...['Daily drop','Collection','Pass'].map(n=>button(n,()=>navigate(n),page===n?'active':'')));if(page==='Pass')return profile();if(page==='Collection'){main.innerHTML='<small>Collector archive</small><h1>My collection</h1><div class="panel" id="loyalty"></div><div class="grid"></div>';main.querySelector('#loyalty').textContent=state.redeemed?'Loyalty reward redeemed':Math.min(5,state.cards.length)+' / 5 cards toward a free demo card';for(const id of new Set(state.cards))main.querySelector('.grid').append(tile(id,state.cards.filter(x=>x===id).length));if(!state.cards.length){main.insertAdjacentHTML('beforeend','<p>Your first night belongs here.</p>');main.append(button('Explore the daily drop',()=>navigate('Daily drop'),'primary'))}return}
