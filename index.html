<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#09090d">
<title>Night Cards</title>
<link rel="stylesheet" href="summer-art.css">
<link rel="stylesheet" href="night.css?v=3">
</head>
<body>
<header><a class="brand" href="#daily-drop"><i aria-hidden="true"></i>Night Cards</a><nav aria-label="Main navigation"><a href="#daily-drop">drop</a><a href="#collection">collection</a></nav><button id="profile" class="profile-button" aria-label="Open profile"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg></button></header><main></main><dialog aria-labelledby="heading"><div class="line"><h2 id="heading"></h2><button aria-label="Close dialog" onclick="box.close()">×</button></div><div id="body"></div></dialog><script>
const cards=[
 {name:'Night Cards',day:'Nov 16',sign:'♦',ink:'#653055',story:'A velvet jacket, a gold cane, and one last dance beneath the disco ball.'},
 {name:'Velvet Fox',day:'Nov 15',sign:'♢',ink:'#8b415c',story:'A quick step across the velvet floor, a silver fan opening on the beat.'},
 {name:'Midnight Moth',day:'Nov 14',sign:'✦',ink:'#45417c',story:'Wings spread beneath the last violet beam of the night.'},
 {name:'Neon Jack',day:'Nov 13',sign:'♠',ink:'#286565',story:'A jackrabbit tips his hat under the neon marquee.'}];
const key='denver-dealer-demo-v1', main=document.querySelector('main'),box=document.querySelector('dialog'),body=document.querySelector('#body'),heading=document.querySelector('#heading');
let state={alias:'',cards:[],invite:''},page='Daily drop';
try{Object.assign(state,JSON.parse(localStorage.getItem(key)))}catch{}
function save(){localStorage.setItem(key,JSON.stringify(state))}

const summerNights = [
  ['Copper Hour','Jun 5','A fox plays the last rooftop set as the windows across the street catch fire with sunset.'],
  ['Blue Current','Jun 13','A heron leans into the synth, sending a low pulse through the blue room.'],
  ['Crate Digger','Jun 26','The raccoon slips a violet-label pressing from its sleeve and cues side B.'],
  ['Scarlet Shuffle','Jul 3','A jackrabbit cuts the deck one-handed while the brass band takes a break.'],
  ['Disco Lynx','Jul 11','Every mirrored tile catches a different flash of the lynx’s gold jacket.'],
  ['Night Frequency','Jul 24','One ear beneath the headphones, the owl holds the next track for one more bar.'],
  ['Silver Howl','Jul 31','A silver coyote leaves the stage lights behind and sings straight into the crowd.'],
  ['Emerald Pocket','Aug 8','The stag walks a bass line under green lights until the whole floor moves with him.'],
  ['Pink Flamingo','Aug 21','A flamingo lifts a citrus cocktail to the last streak of coral in the sky.'],
  ['After Midnight','Aug 29','The panther closes the summer with a drum solo beneath an indigo moon.']
];
const summerStart = cards.length;
summerNights.forEach(([name, day, story], portrait) => cards.push({name, day, story, portrait}));
if (!state.summer2026) {
    state.cards.push(...summerNights.map((_, i) => summerStart + i).reverse());
    state.summer2026 = true;
    if (!state.alias) state.alias = 'Lou';
    save();
}
page = 'Daily drop';

const featuredImage = 'night-cards.webp';

function cardMetadata(id, count) {
  const card = cards[id];
  const date = state.cards.includes(id) ? purchaseDate(id) : card.day+', 2026';
  return '<div class="card-meta"><div>'+card.name+'</div><time>'+date+'</time>'+(count > 1 ? '<span>'+count+' owned</span>' : '')+'</div>';
}
function portraitMarkup(card, id, count) {
  const x = (card.portrait % 5) * 25;
  const y = Math.floor(card.portrait / 5) * 100;
  return '<div class="playing-card"><div class="card-corner"><span>♦</span><span>NC</span></div><div class="summer-art" style="background-position:'+x+'% '+y+'%"></div>'+cardMetadata(id, count)+'<div class="card-corner card-bottom"><span>♦</span><span>NC</span></div></div>';
}
function cardArtwork(id, count) {
  const card = cards[id];
  if (Number.isInteger(card.portrait)) return portraitMarkup(card, id, count);
  if (id === 0) return '<div class="playing-card featured-card"><img class="featured-art" src="'+featuredImage+'" alt="Night Cards, a bear in a black suit holding a gold cane on a disco floor">'+(state.cards.includes(id) ? '<div class="image-meta">'+cardMetadata(id, count)+'</div>' : '')+'</div>';
  return '<div class="playing-card"><div class="card-corner">♦</div><div class="poster" style="--ink:'+card.ink+'">'+card.sign+'</div>'+cardMetadata(id, count)+'<div class="card-corner card-bottom">♦</div></div>';
}
function purchaseDate(id) {
  return Number.isInteger(cards[id].portrait) ? cards[id].day+', 2026' : (state.purchaseDates || {})[id] || cards[id].day+', 2026';
}
function button(label,fn,style=''){const el=document.createElement('button');el.textContent=label;el.className=style;el.onclick=fn;return el}
function modal(title,html){heading.textContent=title;body.innerHTML=html;if(!box.open)box.showModal()}

function tile(id, count) {
  const card = cards[id];
  const el = button('', () => detail(id), 'tile');
  el.setAttribute('aria-label', 'View '+card.name);
  el.innerHTML = cardArtwork(id, count);
  return el;
}
function detail(id) {
  const card = cards[id];
  modal(card.name, cardArtwork(id)+'<p>'+card.story+'</p>');
  if (!Number.isInteger(card.portrait)) body.append(button('Claim this card', () => checkout(id), 'primary'));
}
function checkout(id){modal('Collect '+cards[id].name,'<p>Demo checkout · Bronze edition · $80 per card</p><form><label>Quantity<input type="number" min="1" max="20" step="1" value="1" required></label><label>Payment method<select><option>Apple Pay</option><option>Google Pay</option><option>PayPal</option></select></label><p id="total"></p><button class="primary">Confirm demo collection</button></form>');const form=body.querySelector('form'),qty=form.querySelector('input');function update(){const reward=state.cards.length>=5&&!state.redeemed;form.querySelector('#total').textContent='Demo total $'+Math.max(0,80*(Number(qty.value)-(reward?1:0)))+(reward?' · One loyalty card applied':'')+' · No charge'}qty.oninput=update;update();form.onsubmit=e=>{e.preventDefault();if(state.cards.length>=5)state.redeemed=true;state.purchaseDates = state.purchaseDates || {};state.purchaseDates[id] = new Date().toLocaleDateString('en-US', {month:'short',day:'numeric',year:'numeric',timeZone:'America/Denver'});state.cards.push(...Array(Number(qty.value)).fill(id));save();render();modal('Added to your collection','<p>Your '+cards[id].name+' purchase was simulated and saved on this device.</p>');body.append(button('View collection',()=>{box.close();navigate('Collection')},'primary'))}}

function profile() {
  modal('Profile', '<section class="panel"><small>Alias</small><h2 id="alias"></h2><p>Your collection stays on this device.</p><div class="actions"></div></section><section class="panel"><h2>Member invitations</h2><p>Generate a fresh demo referral code.</p><output></output></section>');
  body.querySelector('#alias').textContent = state.alias || 'Guest collector';
  body.querySelector('.actions').append(
    button('Demo sign-in', signin),
    button('Telegram support', () => modal('Telegram support', '<p>Demo support channel. A Telegram handle will appear here when the support team connects one.</p>'))
  );
  const out = body.querySelector('output');
  out.textContent = state.invite;
  out.before(button('Generate code', () => {
    state.invite = 'NC-'+crypto.randomUUID().slice(0,8).toUpperCase();
    save();
    profile();
  }));
}
function signin(){modal('Collector sign-in','<form><p>Preview phone sign-in with a fictional number.</p><label>Demo phone number<input type="tel" value="303-555-0100" required></label><button>Preview magic link</button></form>');body.querySelector('form').onsubmit=e=>{e.preventDefault();modal('Demo magic link','<p>No SMS was sent. Open the simulated link to choose your alias.</p>');body.append(button('Open demo link',()=>{modal('Choose an alias','<form><label>Collector alias<input maxlength="32" required pattern=".*\\S.*"></label><button>Save collector pass</button></form>');body.querySelector('form').onsubmit=e=>{e.preventDefault();state.alias=body.querySelector('input').value.trim();save();box.close();render()}}))}}
function navigate(to) {
  render();
  document.querySelector(to === 'Collection' ? '#collection' : '#daily-drop').scrollIntoView();
}


function render() {
  main.innerHTML = `
    <section id="daily-drop" class="daily-drop" aria-labelledby="drop-title">
      <div class="stage" aria-hidden="true"><i></i></div>
      <h1 id="drop-title" class="layered-title"><span class="echo" aria-hidden="true" data-word="drop"></span>drop</h1>
      <button class="claim-card" aria-label="Claim Night Cards">${cardArtwork(0)}</button>
      <p class="claim-hint"><span aria-hidden="true">✧</span> Tap the card to claim it</p>
    </section>
    <section id="collection" aria-labelledby="collection-title">
      <div class="collection-heading"><h2 id="collection-title" class="layered-title"><span class="echo" aria-hidden="true" data-word="collection"></span>collection</h2><span>${state.cards.length} ${state.cards.length === 1 ? 'card' : 'cards'}</span></div>
      <div class="grid"></div>
    </section>`;
  main.querySelector('.claim-card').onclick = () => checkout(0);
  const grid = main.querySelector('.grid');
  for (const id of new Set(state.cards)) {
    grid.append(tile(id, state.cards.filter(value => value === id).length));
  }
  if (!state.cards.length) grid.innerHTML = '<p>Your first night belongs here.</p>';
}
document.querySelector('#profile').onclick = profile;
render();
</script></body></html>
